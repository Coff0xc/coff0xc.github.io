name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh GitHub stats / contribution heatmap even on days with no commits.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          # Default Actions token — used only for read-only public GraphQL
          # queries (pinned repos, contribution totals). Falls back to REST
          # + the public contributions page automatically if unavailable.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
